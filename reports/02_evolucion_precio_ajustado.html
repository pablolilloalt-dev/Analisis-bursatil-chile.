</div>

<p class="note">En escala logarítmica, una misma distancia vertical equivale a la misma variación porcentual, así que acciones de precios muy distintos se comparan por tendencia. Haz clic en una empresa de la leyenda para ocultarla o mostrarla.</p>

 const L=62,R=14,Tp=12,B=28,pw=w-L-R,ph=h-Tp-B,vis=D.filter(s=>s.on);
 let lo=Infinity,hi=-Infinity;
 vis.forEach(s=>s.x.forEach((x,j)=>{if(x>=st.a&&x<=st.b){const v=s.p[j];if(v<lo)lo=v;if(v>hi)hi=v}}));
 cx.font='12px "IBM Plex Sans",system-ui,sans-serif';
 if(!isFinite(lo)){cx.fillStyle=css("--mut");cx.fillText("Sin datos para el periodo o la selección",L,h/2);G=null;return}
 if(st.log){lo*=.9;hi*=1.1}else{lo=0;hi*=1.05}
 const X=t=>L+(t-st.a)/(st.b-st.a||1)*pw;
 const Y=st.log?v=>Tp+ph-(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*ph:v=>Tp+ph-(v-lo)/(hi-lo)*ph;
 let ticks=[];
 if(st.log){const dec=Math.log10(hi/lo),ms=dec>1.2?[1,2,5]:[1,1.5,2,3,5,7];
  for(let k=Math.floor(Math.log10(lo));k<=Math.ceil(Math.log10(hi));k++)ms.forEach(m=>{const v=m*10**k;if(v>=lo&&v<=hi)ticks.push(v)})}
 else{const raw=(hi-lo)/5,p=10**Math.floor(Math.log10(raw)),stp=[1,2,5,10].find(m=>m*p>=raw)*p;for(let v=0;v<=hi;v+=stp)ticks.push(v)}
 cx.textAlign="right";cx.textBaseline="middle";cx.lineWidth=1;
 ticks.forEach(v=>{const y=Math.round(Y(v))+.5;cx.strokeStyle=css("--grid");cx.beginPath();cx.moveTo(L,y);cx.lineTo(w-R,y);cx.stroke();cx.fillStyle=css("--mut");cx.fillText(fm(v),L-8,y)});
 const span=(st.b-st.a)/864e5,step=span<=500?1:span<=1500?3:span<=4500?12:24;
 const d0=new Date(st.a);let y0=d0.getUTCFullYear(),m0=d0.getUTCMonth();if(step>=12){m0=0;y0=Math.ceil((y0)/(step/12))*(step/12)}else{m0=Math.ceil(m0/step)*step}
 cx.textAlign="center";cx.textBaseline="top";
 for(let c=0;c<200;c++){const t=Date.UTC(y0,m0+c*step,1);if(t>st.b)break;if(t<st.a)continue;const x=Math.round(X(t))+.5;
  cx.strokeStyle=css("--grid");cx.beginPath();cx.moveTo(x,Tp);cx.lineTo(x,Tp+ph);cx.stroke();cx.fillStyle=css("--mut");
  cx.fillText(step>=12?String(new Date(t).getUTCFullYear()):new Date(t).toLocaleDateString("es-CL",{timeZone:"UTC",month:"short",year:"2-digit"}),x,h-B+8)}
 cx.lineWidth=1.8;cx.lineJoin="round";
 vis.forEach(s=>{cx.strokeStyle=css(s.c);cx.beginPath();let on=false;
  for(let j=0;j<s.x.length;j++){const x=s.x[j];if(x<st.a||x>st.b)continue;const px=X(x),py=Y(s.p[j]);on?cx.lineTo(px,py):cx.moveTo(px,py);on=true}cx.stroke()});
 G={L,R,Tp,ph,pw,w,X,Y};
 if(st.h!==null){const t=st.h,x=X(t);cx.strokeStyle=css("--mut");cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(x,Tp);cx.lineTo(x,Tp+ph);cx.stroke();cx.setLineDash([]);
  vis.forEach(s=>{const v=s.m.get(t);if(v===undefined)return;cx.fillStyle=css(s.c);cx.beginPath();cx.arc(x,Y(v),4,0,7);cx.fill()})}
}
function tip(t,px){const el=$("tip");
 const rows=D.filter(s=>s.on&&s.m.has(t)).sort((a,b)=>b.m.get(t)-a.m.get(t));
 if(!rows.length){el.style.display="none";return}
 el.innerHTML="<b>"+fd(t)+"</b>"+rows.map(s=>'<div><span><i style="background:'+css(s.c)+'"></i>'+s.n+"</span><span>"+fm(s.m.get(t))+"</span></div>").join("");
 el.style.display="block";const cw=$("ch").clientWidth,tw=el.offsetWidth;let left=px+14;if(left+tw>cw-4)left=px-tw-14;el.style.left=Math.max(4,left)+"px";el.style.top="14px"}
function near(t){let a=0,b=U.length-1;while(b-a>1){const m=(a+b)>>1;U[m]<t?a=m:b=m}return Math.abs(U[a]-t)<Math.abs(U[b]-t)?U[a]:U[b]}
function move(e){if(!G)return;const rc=cv.getBoundingClientRect(),px=e.clientX-rc.left;
 if(px<G.L||px>G.w-G.R){leave();return}
 const t=near(st.a+(px-G.L)/G.pw*(st.b-st.a));if(t<st.a||t>st.b)return;st.h=t;draw();tip(t,G.X(t))}
function leave(){st.h=null;$("tip").style.display="none";draw()}
cv.addEventListener("pointermove",move);cv.addEventListener("pointerleave",leave);
function sync(){$("d1").value=iso(st.a);$("d2").value=iso(st.b);
 document.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===st.p));
 $("bl").setAttribute("aria-pressed",st.log);$("bn").setAttribute("aria-pressed",!st.log);
 $("sub").textContent="Precio de cierre ajustado, "+fd(st.a)+" a "+fd(st.b)}
function preset(p){st.p=p;st.b=MAX;if(p==="all")st.a=MIN;else{const e=new Date(MAX);e.setUTCFullYear(e.getUTCFullYear()-Number(p));st.a=Math.max(MIN,e.getTime())}}
function all(){sync();draw()}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{preset(b.dataset.p);all()});
$("d1").onchange=e=>{if(e.target.value){st.a=Math.max(MIN,T(e.target.value));st.p="";if(st.a>=st.b)st.a=st.b-864e5;all()}};
$("d2").onchange=e=>{if(e.target.value){st.b=Math.min(MAX,T(e.target.value));st.p="";if(st.b<=st.a)st.b=st.a+864e5;all()}};
$("bl").onclick=()=>{st.log=true;all()};$("bn").onclick=()=>{st.log=false;all()};
$("d1").min=$("d2").min=iso(MIN);$("d1").max=$("d2").max=iso(MAX);
$("leg").innerHTML=D.map((s,i)=>'<button aria-pressed="true" data-i="'+i+'"><i style="background:var('+s.c+')"></i>'+s.n+"</button>").join("");
document.querySelectorAll("#leg button").forEach(b=>b.onclick=()=>{const s=D[b.dataset.i];s.on=!s.on;b.setAttribute("aria-pressed",s.on);draw()});
new ResizeObserver(draw).observe($("ch"));
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
sync();draw();
</script></body></html>
