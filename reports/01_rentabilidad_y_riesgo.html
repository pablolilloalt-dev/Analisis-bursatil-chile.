 D.forEach(s=>{if(st.sec&&s.s!==st.sec)return;if(st.tic&&s.k!==st.tic)return;let any=false;
  for(let i=0;i<s.d.length;i++){const f=s.d[i];if(f<st.d1||f>st.d2)continue;any=true;const r=s.r[i];if(r!==null){n++;sum+=r;sq+=r*r}}
  if(any)emp++});
 const m=n?sum/n:null,sd=n>1?Math.sqrt(Math.max(0,(sq-n*m*m)/(n-1))):null;
 const k1=$("k1");
 if(m===null){k1.textContent="Sin datos";k1.className="v";$("s1").textContent="Ajusta los filtros";$("k2").textContent="Sin datos";$("s2").textContent="";$("k3").textContent="0";$("s3").textContent="";return}

 $("sub").textContent="Datos del "+st.d1.split("-").reverse().join("/")+" al "+st.d2.split("-").reverse().join("/")}
